<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fehler - {title}</title>
  {#bundle /}
  <style>
    .error-container {
      margin-top: 5rem;
    }

    .error-code {
      font-size: 10rem;
      color: #dc3545;
    }

    .error-title {
      font-size: 2rem;
      color: #6c757d;
    }
  </style>
</head>
<body>
<div class="container mt-4 error-container">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="error-code">{code}</div>
      <h1 class="error-title">{title}</h1>
      <a href="/planets/ui" class="btn btn-primary mt-3">Zurück zur Planetenliste</a>
    </div>
  </div>
</div>
</body>
</html>
