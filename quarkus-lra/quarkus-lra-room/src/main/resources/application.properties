# Port
quarkus.http.port=8180

# Logging
quarkus.log.console.darken=1
quarkus.log.console.format=%s%e%n
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=ERROR
quarkus.log.category."de.gedoplan.showcase".level=DEBUG

# Persistence
quarkus.hibernate-orm.database.generation=update

# LRA Coordinator (no dev service available yet)
quarkus.lra.coordinator-url=http://localhost:8380/lra-coordinator