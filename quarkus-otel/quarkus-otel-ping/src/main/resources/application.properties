# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=ALL
quarkus.log.console.darken=1

quarkus.log.level=INFO

quarkus.log.category."de.gedoplan".level=DEBUG

# Pong API location
de.gedoplan.showcase.rest.PongApi/mp-rest/url=http://localhost:8180/

# Open Telemetry
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
